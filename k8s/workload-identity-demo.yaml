# Demo: Pod liest per Workload Identity über den Private Endpoint aus dem Key Vault.
#   export WORKLOAD_CLIENT_ID=$(terraform -chdir=infra output -raw workload_client_id)
#   envsubst < k8s/workload-identity-demo.yaml | kubectl apply -f -
apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-app
  namespace: demo
  annotations:
    azure.workload.identity/client-id: "${WORKLOAD_CLIENT_ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        azure.workload.identity/use: "true" # Webhook injiziert Token + AZURE_* Variablen
    spec:
      serviceAccountName: demo-app
      containers:
        - name: azure-cli
          image: mcr.microsoft.com/azure-cli:latest
          command: ["sleep", "infinity"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
